# Render Blueprint voor "Veilig Online".
# Plaats dit bestand in de root en kies in Render: "New + → Blueprint".
services:
  - type: web
    name: veilig-online
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false   # zelf invullen in het Render dashboard met de Neon connection string
      - key: SESSION_SECRET
        generateValue: true   # Render genereert automatisch een sterke waarde
